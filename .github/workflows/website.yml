name: Website

# Builds website/ (the docs page reads docs/getting-started.md) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Until f2f.js.org is live the site is served at e-verything.github.io/F2F; then set SITE_URL to it and drop BASE_PATH.
      SITE_URL: https://e-verything.github.io
      BASE_PATH: /F2F
      PUBLIC_REPO_URL: https://github.com/E-verything/F2F
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
